name: "AEON-XS MTP+TQ (Vision)"
internal_name: vision-tq-mtp
runtime: vllm
compose_file: compose/vllm.yml
container_name: vllm-vision-tq-mtp
port: 8000
model:
  weights_subdir: aeon-qwen3.6-27b-ultimate-nvfp4-mtp-xs
  hf_repo: AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-Multimodal-NVFP4-MTP-XS
  format: modelopt
  chat_template: chat-templates/aeon-vision/chat_template.jinja
params:
  context: 332000
  kv_cache: turboquant_4bit_nc
  mtp: 3
env:
  MODALITY: vision
  SPEC_CONFIG: '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
  MAX_MODEL_LEN: 332000
  GPU_MEMORY_UTIL: 0.92
  MAX_NUM_SEQS: 6
  MAX_NUM_BATCHED: 4096
genesis:
  prealloc_v2: 1
  p5b: 1
  p67: 1
  pn8: 0
  pn34: 1
  p82: 0
  p98: 0
  pn59: 0
  pn54: 0
  pn32: 0
description: "Engine: vLLM · KV: turboquant · Ctx: 324K · MTP3 · Vision · AEON-XS · Genesis"
labels: [production, vision, genesis]
deprecated: false